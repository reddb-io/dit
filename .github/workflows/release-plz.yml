name: release-plz

# Commit-driven semver. release-plz reads the Conventional Commits on main and
# opens a "release" PR that bumps Cargo.toml + CHANGELOG.md. Merging that PR
# creates the version tag. Versioning lives here; building/publishing lives in
# release.yml — the same split reddb uses between changesets.yml and release.yml.
#
# The tag alone does NOT start release.yml: GitHub's documented rule is that
# GITHUB_TOKEN-pushed refs never trigger workflows (verified on this repo with
# v0.3.0). So after release-plz tags, the step below dispatches release.yml
# explicitly — workflow_dispatch IS allowed to fire from GITHUB_TOKEN.

on:
  push:
    branches: [main]

permissions:
  contents: write       # create the version tag + commit the changelog
  pull-requests: write  # open/update the release PR
  actions: write        # dispatch release.yml for the new tag

concurrency:
  group: release-plz-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Version from commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so release-plz can diff against the last tag.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0

      # `git_only` makes release-plz run `cargo package` to compare the working
      # tree against the tagged release, and `cargo package` *verifies by
      # building*. That drags in alsa-sys, whose build script panics without
      # libasound. This job never needed a compiler before git_only, which is
      # why it alone lacks the dep that ci.yml and release.yml both install.
      - name: Install ALSA dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # An idle release-plz is indistinguishable from a healthy one: it exits 0
      # and prints {"prs":[]}. That is how this repo went from v0.3.0 to v0.3.1
      # with no release PR ever opened, across a month of green runs. If there
      # are feat/fix/breaking commits since the last tag and release-plz
      # proposed nothing, say so out loud.
      - name: Flag a silent no-op
        if: steps.release-plz.outputs.prs_created != 'true' && steps.release-plz.outputs.releases_created != 'true'
        run: |
          set -uo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          [[ -n "$LAST_TAG" ]] || exit 0
          BUMPING="$(git log --format=%s "${LAST_TAG}..HEAD" |
            grep -cE '^(feat|fix)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:' || true)"
          if [[ "${BUMPING:-0}" -gt 0 ]]; then
            echo "::warning::release-plz proposed no release PR, but ${BUMPING} version-bumping commit(s) landed since ${LAST_TAG}. It may be skipping this package — check release-plz.toml (git_only) and Cargo.toml (publish)."
          else
            echo "release-plz proposed nothing; no version-bumping commits since ${LAST_TAG}. Expected."
          fi

      # GITHUB_TOKEN-pushed tags never trigger workflows, so start the binary
      # build ourselves for each release this run just tagged.
      - name: Dispatch release build
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.release-plz.outputs.releases }}' | jq -r '.[].version' |
            while read -r version; do
              echo "dispatching release.yml for $version"
              gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f version="$version"
            done
