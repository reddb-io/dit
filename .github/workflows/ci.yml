name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Trunk is Linux-only. The tag/manual release workflow remains the
        # authoritative multi-OS and multi-arch build gate.
        os: [blacksmith-4vcpu-ubuntu-2404]
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-on-failure: "true"
          # PRs restore-only; caches are saved by post-merge runs on main
          # (Blacksmith bills cache storage per GB-month).
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Build (gui feature)
        run: cargo build --release --features gui

      - name: Build (local engine)
        if: runner.os == 'Linux'
        run: cargo build --release --features local

      - name: Test
        run: cargo test --release
